name: Deploy portfolio to GitHub Pages

# Publishes docs/ to the gh-pages branch, which GitHub Pages serves.
# (The Actions-native Pages flow can't create the Pages site with the
# default workflow token, but pushing gh-pages auto-enables it.)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish docs/ to gh-pages
        run: |
          set -euo pipefail
          COMMIT=$(git commit-tree -m "Deploy site from ${GITHUB_SHA::7}" "${GITHUB_SHA}:docs")
          git push --force origin "${COMMIT}:refs/heads/gh-pages"
