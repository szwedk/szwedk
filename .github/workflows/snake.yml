name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # allows manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # NOTE: third-party action. For maximum supply-chain safety, pin to a
      # full commit SHA instead of the mutable v3 tag:
      #   uses: Platane/snk@<40-char-sha>  # v3
      # (Resolve the SHA at https://github.com/Platane/snk/tags)
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: szwedk
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Plain git plumbing instead of a third-party deploy action, so no
      # external code ever receives the write token.
      - name: Deploy to output branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd dist
          git init -q -b output
          git add -A
          git commit -q -m "Update snake animation"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            output:refs/heads/output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
